server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API и служебные файлы SEO — на бэкенд (один origin: cookie без CORS)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 30m;
  }
  location = /sitemap.xml { proxy_pass http://backend:3000/sitemap.xml; }
  location = /robots.txt { proxy_pass http://backend:3000/robots.txt; }

  # медиа из MinIO на том же origin (без CORS/HSTS/mixed content); в проде S3_PUBLIC_URL указывает на CDN
  location /media/ {
    proxy_pass http://minio:9000/;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Set-Cookie;
    expires 30d;
  }

  # хешированные файлы сборки кэшируются навсегда
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /favicon.png { expires 7d; }
  location /brand/ { expires 7d; }

  # любой адрес страницы — оболочка с мета-тегами конкретной страницы (бэкенд подставляет их в index.html)
  location / { try_files $uri @seo; }
  location @seo {
    rewrite ^ /api/seo/render break;
    proxy_pass http://backend:3000;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
    # если бэкенд недоступен — отдаём обычный SPA
    proxy_intercept_errors on;
    error_page 502 503 504 = /index.html;
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
}
